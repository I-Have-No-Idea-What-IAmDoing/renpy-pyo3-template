[alias]
xtask = "run --package xtask --"

[env]
PYO3_CONFIG_FILE = { value = 'pyo3-config/win.txt', relative = true }



[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
