[workspace]
resolver = "2"
members = [
    ".",
    "xtask",
]

[package]
name = "renpy_rust_module"
version = "0.1.0"
edition = "2024"
description = "A generic PyO3 Rust extension module template for Ren'Py 8"

[lib]
name = "renpy_rust_module"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "anyhow"] }
anyhow = "1.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
